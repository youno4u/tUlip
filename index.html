<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TULIP: 무조건적 선택</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; touch-action: manipulation; user-select: none; }
        .screen { display: none !important; }
        .screen.active { display: flex !important; flex-direction: column; flex-grow: 1; position: relative; min-height: 100vh; }
        
        /* 광클 버튼 애니메이션 */
        .tap-btn { transition: transform 0.05s; }
        .tap-btn:active { transform: scale(0.95); }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen w-full text-slate-800 flex flex-col relative overflow-x-hidden">

    <div id="loading-overlay" class="fixed inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center text-white">
        <i class="fas fa-cross fa-spin text-5xl text-purple-500 mb-4" style="animation-duration: 3s;"></i>
        <h2 class="text-xl font-bold">서버에 접속 중입니다...</h2>
        <p class="text-slate-400 text-sm mt-2" id="loading-msg">잠시만 기다려주세요.</p>
    </div>

    <!-- SCREEN 0: 접속 역할 선택 -->
    <div id="screen-login" class="screen items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-md w-full text-center border border-purple-200">
            <h1 class="text-4xl font-black text-purple-800 mb-2">무조건적 선택</h1>
            <h2 class="text-xl font-bold text-slate-600 mb-8">Unconditional Election</h2>
            
            <div class="space-y-4">
                <button onclick="showPlayerLogin()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-black py-5 rounded-2xl shadow-lg transition text-xl">
                    <i class="fas fa-mobile-alt mr-2"></i> 참가자 입장
                </button>
                <div class="h-px bg-slate-200 my-4"></div>
                <button onclick="checkGMAndSetRole()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 rounded-xl shadow transition">
                    <i class="fas fa-user-shield mr-2"></i> GM 통제실 🔒
                </button>
            </div>
        </div>
    </div>

    <!-- 참가자 이름 입력 모달 -->
    <div id="player-name-modal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-80 z-50 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full">
            <h3 class="text-2xl font-black text-slate-800 mb-6 text-center">당신의 이름을 입력하세요</h3>
            <input type="text" id="player-name-input" placeholder="실명 입력" class="w-full px-4 py-4 border-2 border-purple-400 rounded-xl focus:outline-none focus:ring-4 focus:ring-purple-300 mb-4 font-black text-xl text-center">
            <button onclick="joinAsPlayer()" class="w-full bg-purple-600 text-white font-black py-4 rounded-xl shadow-lg text-lg">입장하기</button>
            <button onclick="document.getElementById('player-name-modal').classList.add('hidden')" class="w-full mt-3 text-slate-500 py-2 font-bold">취소</button>
        </div>
    </div>

    <!-- SCREEN 1: 참가자 (모바일) 화면 -->
    <div id="screen-player" class="screen bg-slate-100">
        <header class="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-20">
            <div class="font-bold text-lg"><i class="fas fa-user mr-2"></i><span id="p-my-name">이름</span></div>
            <div class="bg-purple-900 px-3 py-1 rounded-full text-sm font-bold shadow-inner">
                공로 점수: <span id="p-my-score" class="text-yellow-400 ml-1 text-lg">0</span>
            </div>
        </header>

        <div class="p-4 flex-grow flex flex-col items-center justify-center" id="p-main-area">
            <div id="p-state-lobby" class="text-center">
                <i class="fas fa-hourglass-half text-6xl text-slate-300 mb-4 animate-pulse"></i>
                <h2 class="text-2xl font-black text-slate-700">대기 중입니다</h2>
                <p class="text-slate-500 mt-2">곧 게임이 시작됩니다.</p>
            </div>

            <!-- 🔥 타이머가 추가된 광클 화면 🔥 -->
            <div id="p-state-grind" class="hidden flex-col items-center w-full">
                <div class="bg-white px-6 py-3 rounded-full shadow-md border-2 border-red-200 mb-6 flex items-center">
                    <span class="text-xl font-bold text-slate-600">남은 시간:</span> 
                    <span id="p-timer-display" class="text-4xl font-black text-red-600 ml-2 w-16 text-center">30</span>
                    <span class="text-xl font-bold text-red-600">초</span>
                </div>
                <button id="btn-tap" class="tap-btn w-64 h-64 bg-gradient-to-b from-red-500 to-red-700 rounded-full shadow-[0_10px_0_rgb(153,27,27)] active:shadow-[0_0px_0_rgb(153,27,27)] active:translate-y-[10px] text-white font-black text-4xl border-4 border-red-800 flex flex-col items-center justify-center select-none transition-all duration-300">
                    <i class="fas fa-hand-pointer text-5xl mb-2 opacity-80"></i>
                    TAP!
                </button>
                <p class="text-slate-500 mt-10 font-bold">버튼을 미친듯이 연타하세요!</p>
            </div>

            <div id="p-state-law" class="hidden flex-col items-center text-center w-full bg-slate-800 p-8 rounded-3xl shadow-2xl border-4 border-slate-600">
                <i class="fas fa-times-circle text-7xl text-red-500 mb-6"></i>
                <h2 class="text-3xl font-black text-white mb-2">천국 입장 불가</h2>
                <p class="text-slate-300 mb-6 font-bold text-lg">기준 미달입니다.</p>
                <div class="bg-slate-900 w-full p-4 rounded-xl border border-slate-700">
                    <div class="text-slate-400 text-sm">입장 커트라인</div>
                    <div class="text-3xl font-black text-red-400 line-through">10,000,000 점</div>
                    <div class="text-slate-400 text-sm mt-4">당신의 초라한 공로</div>
                    <div class="text-4xl font-black text-yellow-500" id="p-law-my-score">0 점</div>
                </div>
            </div>

            <div id="p-state-election" class="hidden flex-col items-center text-center w-full p-8 rounded-3xl shadow-2xl border-4">
            </div>
        </div>
    </div>

    <!-- SCREEN 2: 진행자 (GM) 화면 -->
    <div id="screen-gm" class="screen bg-slate-100">
        <header class="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-20">
            <h1 class="text-xl font-black text-purple-400"><i class="fas fa-crown mr-2"></i>GM 통제실</h1>
            <button onclick="resetGame()" class="bg-red-600 px-3 py-2 rounded-lg text-xs font-black shadow hover:bg-red-700">데이터 초기화</button>
        </header>
        
        <div class="p-4 flex-grow grid grid-cols-1 lg:grid-cols-2 gap-6 pb-24">
            <div class="bg-white p-6 rounded-3xl shadow-lg border-t-8 border-purple-600 flex flex-col">
                <h2 class="font-black text-2xl text-slate-800 mb-2">🎮 게임 컨트롤</h2>
                <p class="text-slate-500 font-bold mb-6">현재 상태: <span id="gm-current-phase" class="text-purple-600">대기 중</span></p>
                
                <div class="space-y-4 flex-grow flex flex-col">
                    <button onclick="setPhase('grind')" class="w-full py-5 bg-red-100 hover:bg-red-200 text-red-800 font-black text-xl rounded-2xl shadow border-2 border-red-300">
                        1. 행위 언약 (30초 광클 경쟁 시작)
                    </button>
                    <button onclick="setPhase('law')" class="w-full py-5 bg-slate-200 hover:bg-slate-300 text-slate-800 font-black text-xl rounded-2xl shadow border-2 border-slate-400">
                        2. 율법의 기준 (경쟁 중지 & 절망)
                    </button>
                    <button onclick="executeElection()" class="w-full py-6 bg-yellow-100 hover:bg-yellow-200 text-yellow-800 font-black text-2xl rounded-2xl shadow-lg border-2 border-yellow-400 mt-4">
                        3. 무조건적 선택 (랜덤 구원)
                    </button>
                    <div class="h-px bg-slate-200 my-2"></div>
                    <button onclick="grantGraceToAll()" class="w-full py-4 bg-gradient-to-r from-purple-500 to-indigo-600 text-white font-black text-lg rounded-2xl shadow-lg">
                        (옵션) 4. 십자가의 보혈 (전원 은혜 구원)
                    </button>
                </div>
            </div>

            <div class="bg-white p-6 rounded-3xl shadow-lg border-t-8 border-slate-800 flex flex-col">
                <h2 class="font-black text-xl border-b-2 border-slate-100 pb-4 mb-4 flex justify-between items-center">
                    <span>👥 접속자 (<span id="gm-player-count">0</span>명)</span>
                </h2>
                <div id="gm-player-list" class="flex-grow overflow-y-auto space-y-2 max-h-[400px]"></div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        // 🔥 getDocs 와 deleteDoc 도구를 임포트하여 강력한 삭제 기능 활성화 🔥
        import { getFirestore, doc, setDoc, collection, onSnapshot, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const myFirebaseConfig = {
            apiKey: "AIzaSyCfyjgtiDVD4Wsd9iGb9tEdrOGFYxxN2Tw",
            authDomain: "kingdomgenius.firebaseapp.com",
            projectId: "kingdomgenius",
            storageBucket: "kingdomgenius.firebasestorage.app",
            messagingSenderId: "385557748196",
            appId: "1:385557748196:web:457b999a38e4982f188ff1"
        };
        
        let app, auth, db, stateDocRef, playersColRef;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
            app = initializeApp(JSON.parse(__firebase_config)); db = getFirestore(app);
            stateDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'tulip_state', 'main');
            playersColRef = collection(db, 'artifacts', appId, 'public', 'data', 'tulip_players');
        } else {
            app = initializeApp(myFirebaseConfig); db = getFirestore(app);
            stateDocRef = doc(db, 'kingdom_genius_games', 'tulip_u_room', 'data', 'state');
            playersColRef = collection(db, 'kingdom_genius_games', 'tulip_u_room', 'players');
        }
        auth = getAuth(app);

        window.myUid = null; window.myRole = null; 
        window.gameState = { phase: 'lobby', selectedUids: [], grindEndTime: null };
        window.playersData = {}; 
        
        let localScore = 0;
        let lastSyncedScore = 0;
        let syncInterval = null;
        let stateUnsub = null;
        let playersUnsub = null;

        function showAuthError(msg) {
            const overlay = document.getElementById('loading-overlay');
            if(overlay) {
                overlay.innerHTML = `
                    <div class="bg-slate-800 p-8 rounded-2xl text-center border-4 border-red-500 shadow-2xl max-w-sm">
                        <i class="fas fa-exclamation-triangle text-5xl text-red-500 mb-4"></i>
                        <h2 class="text-2xl font-bold text-red-400 mb-2">접속 오류</h2>
                        <p class="text-sm text-slate-300">파이어베이스 '익명 로그인' 설정이<br>비활성화되어 있거나 차단되었습니다.</p>
                        <p class="text-xs text-yellow-400 mt-2 font-bold">[해결방법]</p>
                        <p class="text-xs text-slate-300">Firebase 콘솔 > Authentication > Sign-in method 메뉴에서 '익명(Anonymous)'을 사용 설정해주세요.</p>
                        <p class="text-xs text-slate-500 mt-4 break-all">${msg}</p>
                    </div>
                `;
            }
        }

        const initAuth = async () => {
            try {
                const overlay = document.getElementById('loading-overlay');
                const msg = document.getElementById('loading-msg');
                if(overlay) overlay.classList.remove('hidden');
                if(msg) msg.innerText = "보안 인증을 진행합니다...";

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        window.myUid = user.uid;
                        if(overlay) overlay.classList.add('hidden');
                        switchScreen('screen-login');
                        setupRealtimeListeners(user);
                    }
                });

            } catch (error) { 
                console.error("Auth error:", error); 
                showAuthError(error.message);
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            initAuth();
            setTimeout(() => {
                const overlay = document.getElementById('loading-overlay');
                if (overlay && !overlay.classList.contains('hidden') && !overlay.innerHTML.includes('해결방법')) {
                    showAuthError("접속 시간 초과 (10초): 파이어베이스 설정이 올바른지 확인해주세요!");
                }
            }, 10000);
        });

        async function setupRealtimeListeners(user) {
            if (!user) return;
            
            if (stateUnsub) stateUnsub();
            if (playersUnsub) playersUnsub();
            
            stateUnsub = onSnapshot(stateDocRef, async (docSnap) => {
                if (docSnap.exists()) { 
                    window.gameState = docSnap.data(); 
                    updateUIBasedOnRole(); 
                } else {
                    try {
                        await setDoc(stateDocRef, { phase: 'lobby', selectedUids: [] }, { merge: true });
                    } catch(e) { console.error("초기 상태 생성 실패", e); }
                }
            }, (error) => console.error("State sync error:", error));

            playersUnsub = onSnapshot(playersColRef, (querySnapshot) => {
                window.playersData = {};
                querySnapshot.forEach((doc) => {
                    window.playersData[doc.id] = doc.data();
                });
                
                // 🔥 삭제 로직: 내가 참가자인데 명단에서 내 데이터가 사라졌다면 튕겨내기 🔥
                if (window.myRole === 'player' && window.myUid && !window.playersData[window.myUid]) {
                    alert("진행자가 게임을 초기화했습니다. 다시 입장해주세요.");
                    window.myRole = null;
                    switchScreen('screen-login');
                    return; // 튕겨낸 후에는 UI 업데이트 중지
                }
                
                updateUIBasedOnRole();
            }, (error) => console.error("Players sync error:", error));
        }

        window.switchScreen = (id) => { 
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); 
            const target = document.getElementById(id);
            if(target) target.classList.add('active'); 
        };

        window.checkGMAndSetRole = () => {
            const pwd = prompt("GM 비밀번호를 입력하세요:");
            if (pwd === "1004") { window.myRole = 'gm'; switchScreen('screen-gm'); updateUIBasedOnRole(); } 
            else if (pwd !== null) alert("비밀번호가 틀렸습니다.");
        };

        window.showPlayerLogin = () => { 
            document.getElementById('player-name-modal').classList.remove('hidden'); 
        };

        window.joinAsPlayer = async () => {
            const name = document.getElementById('player-name-input').value.trim();
            if(!name) return alert("이름을 입력하세요.");
            document.getElementById('player-name-modal').classList.add('hidden');
            
            localScore = 0;
            lastSyncedScore = 0;
            
            try {
                const myPlayerRef = doc(playersColRef, window.myUid);
                await setDoc(myPlayerRef, { name: name, score: 0 }, { merge: true });
            } catch(e) {
                console.error("Player save error", e);
                alert("데이터베이스 접근 권한이 없습니다.");
                return; 
            }
            
            // 데이터 저장이 성공적으로 끝난 뒤에만 역할을 '참가자'로 확정 짓습니다.
            window.myRole = 'player';
            document.getElementById('p-my-name').innerText = name; // 내 화면 헤더에 이름 표시
            switchScreen('screen-player');
            startScoreSync();
            setupTapListener(); 
        };

        function setupTapListener() {
            const tapBtn = document.getElementById('btn-tap');
            if(tapBtn) {
                const handleTap = (e) => {
                    if(e) e.preventDefault();
                    if(window.gameState.phase === 'grind') {
                        // 남은 시간이 있을 때만 클릭 인정
                        let timeLeft = window.gameState.grindEndTime ? Math.max(0, Math.ceil((window.gameState.grindEndTime - Date.now()) / 1000)) : 0;
                        if(timeLeft > 0) {
                            localScore += 1;
                            document.getElementById('p-my-score').innerText = localScore;
                        }
                    }
                };
                tapBtn.removeEventListener('touchstart', handleTap);
                tapBtn.removeEventListener('mousedown', handleTap);
                tapBtn.addEventListener('touchstart', handleTap, {passive: false});
                tapBtn.addEventListener('mousedown', handleTap);
            }
        }

        // 🔥 클라이언트에서 100ms마다 타이머를 업데이트 하는 로직 🔥
        setInterval(() => {
            if (window.gameState && window.gameState.phase === 'grind' && window.gameState.grindEndTime) {
                let timeLeft = Math.max(0, Math.ceil((window.gameState.grindEndTime - Date.now()) / 1000));
                
                // 참가자 UI 업데이트
                if(window.myRole === 'player') {
                    const pTimer = document.getElementById('p-timer-display');
                    if (pTimer) pTimer.innerText = timeLeft;
                    
                    const tapBtn = document.getElementById('btn-tap');
                    if (tapBtn) {
                        if (timeLeft <= 0) {
                            // 0초가 되면 버튼 잠금 (흑백 & 반투명)
                            tapBtn.classList.add('opacity-50', 'grayscale', 'cursor-not-allowed');
                        } else {
                            tapBtn.classList.remove('opacity-50', 'grayscale', 'cursor-not-allowed');
                        }
                    }
                }
            }
        }, 100);

        function startScoreSync() {
            if(syncInterval) clearInterval(syncInterval);
            syncInterval = setInterval(() => {
                if(localScore !== lastSyncedScore && window.myRole === 'player' && window.gameState.phase === 'grind') {
                    const myPlayerRef = doc(playersColRef, window.myUid);
                    setDoc(myPlayerRef, { score: localScore }, { merge: true }).catch(e => console.error(e));
                    lastSyncedScore = localScore;
                }
            }, 1000);
        }

        function updateUIBasedOnRole() {
            if(!window.gameState) return;
            if(window.myRole === 'player') updatePlayerUI();
            if(window.myRole === 'gm') updateGMUI();
        }

        function updatePlayerUI() {
            const phase = window.gameState.phase || 'lobby';
            const isElected = (window.gameState.selectedUids || []).includes(window.myUid);
            
            document.getElementById('p-state-lobby').classList.add('hidden');
            document.getElementById('p-state-grind').classList.add('hidden');
            document.getElementById('p-state-law').classList.add('hidden');
            document.getElementById('p-state-election').classList.add('hidden');

            if (phase === 'lobby') {
                document.getElementById('p-state-lobby').classList.remove('hidden');
                document.getElementById('p-state-lobby').classList.add('flex');
            } 
            else if (phase === 'grind') {
                document.getElementById('p-state-grind').classList.remove('hidden');
                document.getElementById('p-state-grind').classList.add('flex');
            } 
            else if (phase === 'law') {
                document.getElementById('p-state-law').classList.remove('hidden');
                document.getElementById('p-state-law').classList.add('flex');
                document.getElementById('p-law-my-score').innerText = localScore + " 점";
            } 
            else if (phase === 'election' || phase === 'grace') {
                const elBox = document.getElementById('p-state-election');
                elBox.classList.remove('hidden');
                elBox.classList.add('flex');

                if (isElected || phase === 'grace') {
                    elBox.className = "flex flex-col items-center text-center w-full p-8 rounded-3xl shadow-2xl border-4 bg-yellow-100 border-yellow-400";
                    elBox.innerHTML = `
                        <i class="fas fa-crown text-7xl text-yellow-500 mb-6 animate-bounce"></i>
                        <h2 class="text-3xl font-black text-slate-800 mb-4 leading-tight">은혜로<br>선택받았습니다!</h2>
                        <div class="bg-white p-4 rounded-xl border border-yellow-300 w-full mb-4">
                            <div class="text-slate-400 text-sm font-bold">당신의 공로 점수</div>
                            <div class="text-xl font-bold text-slate-400 line-through">${localScore} 점</div>
                            <div class="text-sm text-red-500 font-bold mt-1">(점수는 아무 상관이 없었습니다)</div>
                        </div>
                        <p class="text-slate-600 font-bold text-lg">자격 없는 자에게 주어지는<br>왕의 무조건적인 초대입니다.</p>
                    `;
                } else {
                    elBox.className = "flex flex-col items-center text-center w-full p-8 rounded-3xl shadow-2xl border-4 bg-slate-800 border-slate-600";
                    elBox.innerHTML = `
                        <i class="fas fa-user-slash text-7xl text-slate-500 mb-6"></i>
                        <h2 class="text-3xl font-black text-white mb-4">선택받지 못했습니다</h2>
                        <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 w-full mb-4">
                            <div class="text-slate-500 text-sm font-bold">내가 열심히 쌓은 점수</div>
                            <div class="text-2xl font-black text-yellow-500">${localScore} 점</div>
                            <div class="text-sm text-red-400 font-bold mt-1">"아니, 내가 점수가 더 높은데 왜!!"</div>
                        </div>
                        <p class="text-slate-400 font-bold">선택은 오직 왕의 주권에 달렸습니다.</p>
                    `;
                }
            }
        }

        function updateGMUI() {
            const phase = window.gameState.phase || 'lobby';
            const pKeys = Object.keys(window.playersData || {});
            
            document.getElementById('gm-player-count').innerText = pKeys.length;
            
            const phaseNames = { lobby:'대기 중', grind:'광클 경쟁 진행 중', law:'절망 (기준 미달)', election:'선택 결과 발표됨', grace:'전원 은혜 구원' };
            document.getElementById('gm-current-phase').innerText = phaseNames[phase] || phase;

            const list = document.getElementById('gm-player-list');
            list.innerHTML = '';
            
            let ranking = pKeys.map(uid => ({ id: uid, name: window.playersData[uid].name, score: window.playersData[uid].score || 0 }));
            ranking.sort((a,b) => b.score - a.score);

            ranking.forEach((p, idx) => {
                const isSelected = (window.gameState.selectedUids || []).includes(p.id) || phase === 'grace';
                const badge = isSelected && (phase === 'election' || phase === 'grace') ? '<span class="bg-yellow-400 text-black px-2 py-1 rounded text-xs font-black">👑 선택됨</span>' : '';
                const bg = isSelected && (phase === 'election' || phase === 'grace') ? 'bg-yellow-50 border-yellow-300' : 'bg-slate-50 border-slate-200';
                
                list.innerHTML += `
                    <div class="p-3 rounded-xl flex justify-between items-center border ${bg}">
                        <div class="font-black text-slate-800"><span class="text-slate-400 text-xs mr-2">${idx+1}위</span>${p.name}</div>
                        <div class="flex items-center">
                            <span class="text-sm font-bold text-red-600 mr-3">${p.score}점</span>
                            ${badge}
                        </div>
                    </div>
                `;
            });
        }

        window.setPhase = async (newPhase) => {
            try {
                let updates = { phase: newPhase };
                
                if(newPhase === 'grind') {
                    updates.grindEndTime = Date.now() + 30000;
                }
                
                await setDoc(stateDocRef, updates, { merge: true });
            } catch(e) { console.error(e); alert("상태 변경 에러!"); }
        };

        window.executeElection = async () => {
            const pKeys = Object.keys(window.playersData || {});
            if(pKeys.length === 0) return alert("참가자가 없습니다!");

            const shuffled = [...pKeys].sort(() => 0.5 - Math.random());
            const selectCount = Math.max(1, Math.floor(pKeys.length * 0.3));
            const chosen = shuffled.slice(0, selectCount);

            try {
                await setDoc(stateDocRef, { phase: 'election', selectedUids: chosen }, { merge: true });
            } catch(e) { console.error(e); alert("에러 발생!"); }
        };

        window.grantGraceToAll = async () => {
            try {
                await setDoc(stateDocRef, { phase: 'grace' }, { merge: true });
            } catch(e) { console.error(e); }
        };

        // 🔥 모든 데이터를 완전히 지우고 참가자들을 튕겨내는 초기화 로직 🔥
        window.resetGame = async () => {
            if(confirm("모든 데이터를 지울까요? (주의: 참가자 데이터도 완전히 삭제되며 다시 접속해야 합니다)")) {
                try {
                    // 1. 상태 문서 초기화
                    await setDoc(stateDocRef, { phase: 'lobby', selectedUids: [], grindEndTime: null });
                    
                    // 2. 참가자 컬렉션의 모든 데이터를 긁어와서 하나씩 삭제
                    const querySnapshot = await getDocs(playersColRef);
                    const deletePromises = [];
                    querySnapshot.forEach((d) => {
                        deletePromises.push(deleteDoc(d.ref));
                    });
                    
                    // 삭제 완료 대기
                    await Promise.all(deletePromises);

                    alert("초기화 완료. 모든 참가자 데이터가 삭제되었습니다.");
                } catch(e) { 
                    console.error(e); 
                    alert("초기화 중 에러가 발생했습니다.");
                }
            }
        };

    </script>
</body>
</html>
